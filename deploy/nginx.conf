server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    # API, uploaded files and API docs go to the backend container.
    location ~ ^/(api/|uploads/|docs|redoc|openapi\.json$|health$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # The frontend hardcodes http://localhost:8000; make it same-origin (/api/v1/...) without editing the file.
    location = /assets/js/config.js {
        sub_filter_types *;
        sub_filter "API_BASE_URL: 'http://localhost:8000'" "API_BASE_URL: ''";
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
